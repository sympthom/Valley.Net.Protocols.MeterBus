name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The tag is the single source of truth for the package version: v4.0.0 -> 4.0.0
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore Valley.Net.Protocols.MeterBus.sln

      - name: Build
        run: dotnet build Valley.Net.Protocols.MeterBus.sln --configuration Release --no-restore -p:Version=$VERSION

      - name: Unit Tests
        run: dotnet test --project tests/Valley.Net.Protocols.MeterBus.Tests/Valley.Net.Protocols.MeterBus.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" --configuration Release --no-build -p:Version=$VERSION --output ./nupkg
          done

      # Pushes the .snupkg symbol packages alongside the .nupkg files
      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
